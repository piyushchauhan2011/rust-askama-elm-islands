services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  lightpanda:
    image: lightpanda/browser:nightly
    restart: unless-stopped
    environment:
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
    ports:
      - "127.0.0.1:9222:9222"
    command: lightpanda serve --host 0.0.0.0 --port 9222
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
