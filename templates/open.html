<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ meta.seo_title }}</title>
    {% if !meta.admin %}
    <meta name="description" content="{{ meta.seo_description }}" />
    <link rel="canonical" href="{{ meta.canonical }}" />
    {% endif %}
    <meta name="robots" content="{{ meta.robots }}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>{{ meta.css|safe }}</style>
    {% if meta.json_ld != "" %}
    <script type="application/ld+json">{{ meta.json_ld|safe }}</script>
    {% endif %}
</head>
<body>
    <div class="site-header__sentinel" aria-hidden="true"></div>
    <header data-overlay="{% if meta.header_overlay %}true{% else %}false{% endif %}" class="site-header {% if meta.header_overlay %}site-header--overlay{% else %}site-header--solid{% endif %}">
        {% if meta.header_overlay %}
        <div class="site-header__scrim header-scrim" aria-hidden="true"></div>
        {% endif %}
        <a class="site-header__skip-link" href="#main">Skip to content</a>
        <div class="app-container site-header__inner">
            <a href="/" class="site-header__brand-link" aria-label="Elsewhere — home">
                <span class="brand {% if meta.header_overlay %}brand--light{% endif %}">
                    <span class="brand__name">Elsewhere</span><small class="brand__tagline">STAYS &amp; STORIES</small>
                </span>
            </a>
            <nav class="site-header__nav" aria-label="Primary navigation">
                <a class="site-header__nav-link" href="/destinations">Destinations</a>
                <a class="site-header__nav-link" href="/search">Hotels</a>
                <a class="site-header__nav-link" href="/blog">Journal</a>
            </nav>
            <div class="site-header__actions">
                <a class="button site-header__search-button {% if meta.header_overlay %}site-header__search-button--overlay{% else %}is-primary{% endif %}" href="/search">Find a stay</a>
            </div>
            {% if meta.admin %}
            <nav class="site-header__admin-mobile-nav" aria-label="Mobile navigation">
                <details>
                    <summary>Menu</summary>
                    <a href="/destinations">Destinations</a>
                    <a href="/search">Hotels</a>
                    <a href="/blog">Journal</a>
                </details>
            </nav>
            {% else %}
            <div data-island="MobileNav" data-hydrate="load" data-props="{&quot;links&quot;:[{&quot;label&quot;:&quot;Destinations&quot;,&quot;href&quot;:&quot;/destinations&quot;},{&quot;label&quot;:&quot;Hotels&quot;,&quot;href&quot;:&quot;/search&quot;},{&quot;label&quot;:&quot;Journal&quot;,&quot;href&quot;:&quot;/blog&quot;}]}"></div>
            {% endif %}
        </div>
    </header>
    <main id="main" class="app-main {% if meta.header_overlay %}app-main--header-overlay{% endif %}">
